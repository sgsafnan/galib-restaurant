<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galib Restaurant | Agra</title>
<style>
html,body{margin:0;padding:0;background:#080808;overflow-x:hidden}
#site{display:block;width:100%;min-height:100vh;border:0}
</style>
</head>
<body>
<iframe id="site" src="./Galib_Restaurant_Table_Booking-1.html" title="Galib Restaurant"></iframe>
<script>
const frame=document.getElementById('site');
function improve(){
  try{
    const d=frame.contentDocument;
    const s=d.createElement('style');
    s.textContent=`
      header{position:sticky;top:0;z-index:10;background:rgba(9,9,9,.96);border-bottom:1px solid #333}
      .nav{padding:8px 18px}
      .brand{gap:10px}
      .brand img{width:52px;height:52px}
      .logo{font-size:23px}
      nav a{color:#ddd;text-decoration:none}
      .hero{min-height:calc(100vh - 70px);padding:28px 18px 65px}
      .hero .logoHero{width:105px;height:105px;margin-bottom:14px}
      .hero h1{font-size:clamp(48px,11vw,88px);letter-spacing:6px}
      .hero h2{font-size:19px}
      .hero p{font-size:17px}
      .btn{color:#eee!important;text-decoration:none!important;border-radius:10px;padding:14px 22px}
      .btn.primary{background:#f1f1f1;color:#111!important;border-color:#f1f1f1}
      .btn[href*="wa.me"]{background:#25D366;color:#fff!important;border-color:#25D366}
      .card{border-color:#333}
      .title h2{letter-spacing:.5px}
      @media(max-width:700px){
        .nav{padding:7px 14px}
        .brand img{width:46px;height:46px}
        .logo{font-size:20px}
        .logo small{font-size:7px}
        .hero{min-height:calc(100vh - 60px);padding:22px 14px 55px}
        .hero .logoHero{width:92px;height:92px}
        .hero h1{font-size:clamp(45px,15vw,72px)}
        .hero h2{font-size:18px}
        .hero p{font-size:16px;max-width:520px}
        .btn{display:inline-block;min-width:180px;margin:5px 3px}
      }
    `;
    d.head.appendChild(s);
    const resize=()=>{frame.style.height=Math.max(d.document.body.scrollHeight,d.document.documentElement.scrollHeight,window.innerHeight)+'px'};
    resize();
    if(window.ResizeObserver)new ResizeObserver(resize).observe(d.document.body);
    window.addEventListener('resize',resize);
  }catch(e){}
}
frame.addEventListener('load',improve);
</script>
</body>
</html>
